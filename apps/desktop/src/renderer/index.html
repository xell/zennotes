<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Content Security Policy.

      script-src keeps 'unsafe-eval' because three diagram engines shipped
      in preview depend on runtime evaluation:
        * function-plot evaluates math.js expressions via new Function()
        * jsxgraph evaluates formula strings for interactive geometry
        * mermaid's parser path has historically relied on runtime eval

      Removing it would disable those features. The proper future fix is
      to render each diagram block inside a sandboxed iframe that has its
      own relaxed CSP, keeping the main renderer on a strict policy.

      style-src keeps 'unsafe-inline' because React inline styles and
      Tailwind arbitrary values emit inline style attributes.

      object-src / base-uri / form-action are all locked down. Navigation is
      additionally gated by setWindowOpenHandler and will-navigate in the main
      process. Note: frame-ancestors is intentionally absent — browsers ignore
      it in <meta> tags (spec-mandated); in Electron the equivalent protection
      comes from the main-process navigation guards above.

      frame-src allows http://localhost:* and http://127.0.0.1:* (a local dev
      server) plus https: generally, so the right pane's Planner tab can host
      Leo's Day Planner web app (PlannerPanel) wherever it's actually
      deployed, not just at a dev port. This is safe to leave broad because
      the frame's src comes from the plannerUrl *setting* — something Leo
      types into Settings himself — never from note content, so widening it
      doesn't hand vault content a way to get an iframe loaded. A future
      custom URL scheme (e.g. planner://) would need its own literal entry
      here too — frame-src can't wildcard arbitrary schemes — and an Electron
      protocol handler registered for it to load at all; neither exists yet.
      No other directive is widened, so the panel can be framed but cannot
      become a channel for loading remote script/style/fetch into the
      renderer.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' data: blob: zen-asset: zen-theme:; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: zen-asset: zen-theme:; media-src 'self' data: blob: zen-asset: zen-theme:; frame-src 'self' data: blob: zen-asset: http://localhost:* http://127.0.0.1:* https:; font-src 'self' data: zen-theme: zen-excalidraw:; worker-src 'self' blob:; connect-src 'self' zen-asset: zen-theme: zen-excalidraw: zen-typst:; object-src 'none'; base-uri 'none'; form-action 'none'; manifest-src 'none';"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZenNotes</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
